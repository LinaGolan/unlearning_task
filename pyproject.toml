[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-unlearning"
version = "2.0.0"
description = "Layer localization and causal activation interventions for selective unlearning"
authors = [{name = "LinaGolan"}]
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "transformers>=4.46", "pyarrow>=17", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
